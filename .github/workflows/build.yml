name: Build

on:
  # 手動実行（GitHub の Actions タブから "Run workflow" ボタンで起動）
  workflow_dispatch:

  # バージョンタグ（例: v1.0.0）を push したときに自動実行
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-latest
            label: macOS

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.label }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build & Package
        run: npm run dist

      # macOS のみ: パッケージ済み .app を起動して 5 秒間クラッシュしないか確認
      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          APP_BIN="release/mac-unpacked/CourtEnd Vision.app/Contents/MacOS/CourtEnd Vision"
          echo "起動: $APP_BIN"

          # バックグラウンドで起動
          "$APP_BIN" &
          APP_PID=$!
          echo "PID: $APP_PID"

          # 5 秒待つ
          sleep 5

          # プロセスが生きているか確認
          if kill -0 $APP_PID 2>/dev/null; then
            echo "✓ スモークテスト成功 (5秒間クラッシュなし)"
            kill $APP_PID
          else
            echo "✗ スモークテスト失敗 (アプリがクラッシュしました)"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}-build
          path: release/*.zip
          retention-days: 30

  # タグ push 時のみ: GitHub Release を作成して ZIP を添付
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    name: Create Release
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
