<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      font-size: 14px;
      background: #1e1e1e;
      color: #e0e0e0;
      padding: 24px;
    }
    h2 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 20px;
      color: #ffffff;
      border-bottom: 1px solid #444;
      padding-bottom: 10px;
    }
    .section {
      font-size: 11px;
      color: #777;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin: 18px 0 8px;
    }
    .row {
      display: flex;
      align-items: center;
      margin-bottom: 14px;
      gap: 12px;
    }
    label {
      width: 120px;
      color: #aaa;
      flex-shrink: 0;
    }
    input[type="color"] {
      width: 60px;
      height: 34px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background: none;
    }
    input[type="range"] {
      flex: 1;
      accent-color: #4caf50;
    }
    input[type="number"] {
      width: 60px;
      padding: 4px 8px;
      background: #2d2d2d;
      border: 1px solid #555;
      border-radius: 4px;
      color: #e0e0e0;
      text-align: center;
    }
    .value-label {
      width: 42px;
      text-align: right;
      color: #ccc;
    }
    /* toggle switch */
    .toggle-row {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
      gap: 12px;
    }
    .toggle-label {
      flex: 1;
      color: #ccc;
      cursor: pointer;
      user-select: none;
    }
    .switch {
      position: relative;
      width: 40px;
      height: 22px;
      flex-shrink: 0;
    }
    .switch input { display: none; }
    .slider {
      position: absolute;
      inset: 0;
      background: #444;
      border-radius: 11px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .slider::before {
      content: '';
      position: absolute;
      width: 16px; height: 16px;
      left: 3px; top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .switch input:checked + .slider { background: #4caf50; }
    .switch input:checked + .slider::before { transform: translateX(18px); }
    .hint {
      font-size: 11px;
      color: #666;
      margin-left: 4px;
    }
    .radio-label {
      display: flex;
      align-items: center;
      gap: 5px;
      color: #ccc;
      cursor: pointer;
      font-size: 13px;
    }
    .radio-label input[type="radio"] {
      accent-color: #4caf50;
      cursor: pointer;
    }
    .buttons {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 22px;
      border-top: 1px solid #444;
      padding-top: 16px;
    }
    button {
      padding: 8px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
    }
    #btn-apply  { background: #4caf50; color: #fff; }
    #btn-apply:hover  { background: #43a047; }
    #btn-reset  { background: #555; color: #e0e0e0; }
    #btn-reset:hover  { background: #666; }
    #btn-close  { background: #333; color: #e0e0e0; }
    #btn-close:hover  { background: #444; }
  </style>
</head>
<body>
  <h2>Grid Settings</h2>

  <div class="section">Appearance</div>

  <div class="row">
    <label>Grid Color</label>
    <input type="color" id="color-input" value="#FFFFFF" />
    <span id="color-hex" style="color:#aaa; font-size:12px">#FFFFFF</span>
  </div>

  <div class="row">
    <label>Opacity</label>
    <input type="range" id="opacity-input" min="10" max="100" step="5" value="70" />
    <span class="value-label" id="opacity-label">70%</span>
  </div>

  <div class="row">
    <label>Line Width</label>
    <input type="number" id="linewidth-input" min="1" max="8" value="2" />
    <span style="color:#aaa; font-size:12px">px</span>
  </div>

  <div class="section">Optional Overlays</div>

  <div class="toggle-row">
    <label class="toggle-label" for="toggle-zones">
      Zone Numbers <span class="hint">(1–9)</span>
    </label>
    <label class="switch">
      <input type="checkbox" id="toggle-zones" />
      <span class="slider"></span>
    </label>
  </div>

  <div class="toggle-row" style="align-items:flex-start; flex-direction:column; gap:6px;">
    <span style="color:#aaa;">Sub-zones <span class="hint">(A / B / C / D)</span></span>
    <div style="display:flex; gap:16px; padding-left:4px;">
      <label class="radio-label"><input type="radio" name="subzones" id="sz-off"       value="off"       /> Off</label>
      <label class="radio-label"><input type="radio" name="subzones" id="sz-grid-only" value="grid-only" /> Grid Only</label>
      <label class="radio-label"><input type="radio" name="subzones" id="sz-full"      value="full"      /> Grid + Labels</label>
    </div>
  </div>

  <div class="buttons">
    <button id="btn-reset">Reset Corners</button>
    <button id="btn-close">Close</button>
    <button id="btn-apply">Apply</button>
  </div>

  <script src="settings.js"></script>
</body>
</html>
